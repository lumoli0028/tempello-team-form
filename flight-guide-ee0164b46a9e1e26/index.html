<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>ClioCon flight booking guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap">
<style>

:root {
  color-scheme: light;
  --bg: #fafaf8; --card: #ffffff; --line: #e3e5ea; --soft: #f3f5f9; --text: #161b26; --muted: #5d667a;
  --blue: #1d4ed8; --green-bg: #e7f5ec; --green: #1d6b3d;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 30px; }
a { color: var(--blue); }
b { font-weight: 700; }
:focus-visible { outline: 3px solid #93b4ff; outline-offset: 2px; }

.top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 4; }
.top-in { max-width: 1180px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.app-title { font-weight: 800; }
.top-btns { display: flex; gap: 6px; }
button.link { background: none; border: 0; color: var(--blue); font: inherit; text-decoration: underline; cursor: pointer; padding: 8px; min-height: 40px; }

.intro-in, main { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.intro-in { padding-top: 28px; padding-bottom: 8px; }
.intro-in > * { max-width: 860px; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.2; margin: 0 0 10px; }
.big { font-size: 1.2rem; margin: 8px 0; }
.small { font-size: .92rem; color: var(--muted); margin: 8px 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 14px 0; }
.btn { display: inline-block; min-height: 52px; padding: 14px 26px; background: var(--blue); color: #fff; border: 2px solid var(--blue); border-radius: 12px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; text-align: center; }
.btn-secondary { background: #fff; color: var(--blue); }
.group { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 6px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; }
.card > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 18px; min-height: 62px; cursor: pointer; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary:hover { background: var(--soft); border-radius: 14px; }
.title { font-size: 1.2rem; font-weight: 700; flex: 1; }
.time { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); margin: 0 6px; transition: transform .15s; flex: none; }
.card[open] > summary .chev { transform: rotate(45deg); }
.badge { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--text); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer; }
.card.done .badge { background: var(--green); }
.card.done .badge::after { content: "\2713"; margin-left: 2px; }
.card.done .title { color: var(--muted); }
.body { padding: 0 18px 14px; }

.part { padding: 14px 0; border-top: 1px solid var(--line); }
.part:first-child { border-top: 0; padding-top: 4px; }
.part h3 { font-size: 1.05rem; margin: 0 0 6px; }
.part-text p { margin: 8px 0; }
@media (min-width: 900px) {
  .part { display: grid; grid-template-columns: minmax(280px, 5fr) 7fr; gap: 24px; align-items: start; }
  .part:not(:has(.shots)) { display: block; max-width: 760px; }
}
.shots { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.shots figure { margin: 0; max-width: 100%; }
figcaption { font-size: .83rem; color: var(--muted); margin-top: 4px; max-width: 60ch; }
/* Every image is shown whole at its natural size: never cropped, never stretched */
.shot { display: block; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; max-width: 100%; }
.shot img { display: block; width: auto; max-width: 100%; height: auto; }

.check { background: var(--green-bg); color: #14532d; border-radius: 8px; padding: 8px 12px; }
.rule { background: var(--soft); border-left: 4px solid var(--blue); border-radius: 6px; padding: 8px 12px; }
.note { background: var(--soft); border-left: 4px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: .93rem; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 4px 0 10px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.flights { padding-left: 1.2em; margin: 8px 0 0; } .flights li { margin: 3px 0; }
.seat-main { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.route { font-weight: 700; flex: 1; }
.seat-no { font-size: 2rem; font-weight: 800; color: var(--blue); line-height: 1; }
.seat-cost { color: var(--muted); }
.save { margin: 6px 0; padding-left: 1.2em; } .save li { margin: 4px 0; }
table.price { width: 100%; max-width: 480px; border-collapse: collapse; }
.price td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.price .num { text-align: right; white-space: nowrap; }
.price tr.total td { font-weight: 800; border-bottom: 0; }

dialog { border: 0; border-radius: 12px; padding: 12px; max-width: 96vw; max-height: 94vh; background: #fff; }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
dialog img { display: block; max-width: 100%; max-height: 82vh; margin: 10px auto 0; }
dialog p { margin: 6px 0 0; font-size: .9rem; color: var(--muted); }
@media (max-width: 640px) { .card > summary { padding: 10px 12px; } .body { padding: 0 12px 12px; } .btn { width: 100%; } .intro-in, main { padding: 0 12px; } .time { display: none; } }

.tablewrap { overflow-x: auto; margin: 8px 0; }
table.grid { width: 100%; border-collapse: collapse; font-size: .92rem; background: #fff; }
.grid th, .grid td { text-align: left; padding: 7px 10px; border: 1px solid var(--line); vertical-align: top; }
.grid thead th { background: var(--soft); font-weight: 700; white-space: nowrap; }
.grid tbody th { background: var(--soft); white-space: nowrap; }

@media (min-width: 900px) { .part.wide { display: block; } .part.wide .shots { margin-top: 12px; } }

/* picture first, instructions underneath */
.part.shotfirst { display: flex; flex-direction: column; gap: 12px; }
.part.shotfirst .shots { order: -1; }
.part.shotfirst .shot { max-width: 760px; }
.part.shotfirst > * { flex: none; }

/* Tempello brand: ink #0F1729, orange #F96706, paper #FAF9F7, panel #F1F2F4. Light only, solid orange accents. */
:root { --ink: #0F1729; --orange: #F96706; --orange-dark: #C2540A; --orange-soft: #FFE7D6; --paper: #FAF9F7; --panel: #F1F2F4; --bg: #F1F2F4; --line: #CDD1D9; --soft: #F1F2F4; --blue: #C2540A; --text: #0F1729; --muted: #566074; }
body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--orange-dark); }
.top { background: #fff; border-bottom: 4px solid var(--orange); }
.top-in { gap: 14px; }
.logo { height: 26px; width: auto; display: block; }
.app-title { color: var(--ink); font-weight: 700; flex: 1; }
button.link { color: var(--orange-dark); }
.intro-in { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; margin: 20px auto 0; padding: 22px 24px 16px; max-width: 1180px; }
.intro-in > * { max-width: 860px; }
h1 { font-weight: 900; color: var(--ink); letter-spacing: -.01em; }
.group { color: var(--ink); font-weight: 900; border-bottom: 3px solid var(--orange); padding-bottom: 4px; }
.btn { background: var(--orange); border-color: var(--orange); color: #fff; box-shadow: none; }
.btn:hover { background: #E05A00; border-color: #E05A00; }
.btn-secondary { background: #fff; color: var(--orange-dark); border-color: var(--orange); }
.card { background: #fff; border: 1.5px solid var(--line); box-shadow: none; }
.card[open] { border-color: var(--orange); }
.card[open] > summary { background: var(--orange-soft); border-radius: 13px 13px 0 0; }
.card > summary:hover { background: var(--orange-soft); }
.title { font-weight: 700; }
.badge { background: var(--orange); color: #fff; }
.card.done .badge { background: #1d6b3d; }
.chev { border-color: var(--ink); }
.part h3 { color: var(--ink); font-weight: 900; }
.check { background: #CFEEDB; border: 1px solid #94D3AB; color: #0F4727; }
.rule { background: var(--orange); color: #fff; border: 0; border-radius: 10px; padding: 10px 14px; }
.note { background: var(--panel); border-left: 4px solid var(--orange); }
.grid thead th, .grid tbody th { background: var(--orange); color: #fff; border-color: var(--orange); }
.grid th, .grid td { border-color: var(--line); }
.seat-no { color: var(--orange-dark); font-weight: 900; }
.shot { border: 1.5px solid #9AA2B1; }
.price tr.total td { color: var(--orange-dark); }
.disclaimer { font-size: .88rem; color: var(--ink); background: var(--orange-soft); border-radius: 8px; padding: 8px 12px; }
dialog { background: #fff; }



[hidden]{display:none!important}
.fr{display:block;position:relative;line-height:0}
.fr img{display:block;max-width:100%;height:auto}
.hl{position:absolute;border:3px solid #f96706;border-radius:6px;box-shadow:0 0 0 2px #fff;pointer-events:none}
.seatlist{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:8px 0}
.seatlist dt{font-weight:700}.seatlist dd{margin:0}
.warn{background:#fff;border:2px solid #f96706;border-radius:8px;padding:8px 12px}
.pick-note{font-size:.95rem}
.price-line{font-weight:800}
ol.how{padding-left:1.3em;margin:6px 0}ol.how li{margin:4px 0}
.shotcol{min-width:0}
.swipe{display:none;font-size:.82rem;color:#5d667a;margin:6px 0 0}
.band{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:12px 16px;margin:26px 0 8px}
.band-label{font-size:.75rem;letter-spacing:.1em;font-weight:900}
.band-title{font-size:1.1rem;font-weight:800;line-height:1.3}
.band-sub{font-size:.9rem}
.band.start.w-b{background:#f96706;color:#fff}
.band.start.w-j{background:#1e4fa3;color:#fff}
.band.start.w-o{background:#fff;border:2px solid #1e4fa3;color:#163a78;margin-top:22px}
.band.end{background:#e7f5ec;border:2px solid #1d6b3d;color:#14532d;margin-top:8px}
.band.end .band-label::before{content:"✓ "}
.panel{--pc:#1e4fa3;--pbg:#f4f7fc;border:3px solid var(--pc);border-radius:18px;background:var(--pbg);margin:28px 0;overflow:hidden}
.panel.p-b{--pc:#f96706;--pbg:#fff6ef}
.panel.p-flight{--pc:#12244a;--pbg:#f3f6fb}
.panel.p-opt{--pc:#1e4fa3;--pbg:#e6eefb;margin:22px 0}
.panel-head{display:flex;gap:14px;align-items:center;background:var(--pc);color:#fff;padding:14px 18px}
.panel-letter{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--pc);font-weight:900;font-size:1.6rem;display:flex;align-items:center;justify-content:center}
.panel-headtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.panel-label{font-size:.75rem;letter-spacing:.1em;font-weight:900}
.panel-title{font-size:1.2rem;font-weight:800;line-height:1.25}
.panel-sub{font-size:.92rem}
.panel-body{padding:14px 14px 6px}
.panel-body > .card{background:#fff}
.panel-foot{display:flex;flex-direction:column;gap:2px;margin:8px 14px 14px;background:#e7f5ec;border:2px solid #1d6b3d;color:#14532d;border-radius:12px;padding:10px 14px}
.panel-foot .panel-label::before{content:"✓ "}
.panel-foot .panel-title{font-size:1rem}
.optpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0 12px}
.optbtn{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid #1e4fa3;border-radius:14px;padding:10px 14px;min-height:68px;font:inherit;color:#163a78;cursor:pointer}
.optbtn .ol{flex:none;width:40px;height:40px;border-radius:50%;background:#1e4fa3;color:#fff;font-weight:900;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.optbtn .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.optbtn small{font-size:.85rem;font-weight:500}
.optbtn.on{background:#1e4fa3;color:#fff}
.optbtn.on .ol{background:#fff;color:#1e4fa3}
.closebtn{display:inline-flex;align-items:center;justify-content:center;margin:12px 0 4px;padding:0;width:48px;height:48px;background:#fff;border:2px solid #5d667a;border-radius:12px;color:#161b26;cursor:pointer}
.closebtn:hover,.panel-close:hover{background:#eef1f6}
.qa .q{margin:12px 0 2px}.qa .a{margin:0 0 6px}
.card.faq{margin-top:26px}
.badge{width:44px;height:44px}
button.link{min-height:44px}
.panel-close{display:flex;align-items:center;justify-content:center;margin-left:auto;flex:none;width:46px;height:46px;padding:0;background:#fff;color:var(--pc);border:0;border-radius:50%;cursor:pointer}
.panel-headtext{flex:1}
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.who-btn{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:2px solid;border-radius:14px;padding:14px 18px;min-height:96px;cursor:pointer;font:inherit;color:#161b26}
.who-btn .who-top{font-size:.72rem;letter-spacing:.1em;font-weight:700}
.who-btn .who-name{font-size:1.6rem;font-weight:900;line-height:1.15}
.who-btn .who-sub{font-size:.9rem}
.who-btn.b{border-color:#f96706}.who-btn.b .who-top{color:#c4500a}
.who-btn.j{border-color:#1e4fa3}.who-btn.j .who-top{color:#1e4fa3}
.who-btn.b.on{background:#f96706;color:#fff}.who-btn.b.on .who-top{color:#fff}
.who-btn.j.on{background:#1e4fa3;color:#fff}.who-btn.j.on .who-top{color:#fff}
.banner{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-radius:14px;padding:16px 18px;margin:14px 0 6px}
.banner-for{display:block;font-size:.72rem;letter-spacing:.1em;font-weight:700}
.banner-who{display:block;font-size:1.7rem;font-weight:900;line-height:1.15}
.banner-line{display:block;font-size:.95rem;margin-top:2px}
.banner.b{background:#fff1e6;border:2px solid #f96706}.banner.b .banner-for{color:#c4500a}
.banner.j{background:#e8f0fc;border:2px solid #1e4fa3}.banner.j .banner-for{color:#1e4fa3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;background:#fff;font-size:.82rem;font-weight:700;border:1.5px solid}
.banner.b .chip{border-color:#f96706;color:#8a3a06}.banner.j .chip{border-color:#1e4fa3;color:#163a78}
body.view-b .top{border-bottom:4px solid #f96706}
body.view-j .top{border-bottom:4px solid #1e4fa3}
body.view-j .badge{background:#1e4fa3}
body.view-j .card.done .badge{background:#1d6b3d}
body.view-j .card[open]{border-color:#1e4fa3}
body.view-j .card[open] > summary,body.view-j .card > summary:hover{background:#eaf1fb}
body.view-j .rule{background:#1e4fa3}
body.view-j .note{border-left-color:#1e4fa3}
body.view-j .grid thead th,body.view-j .grid tbody th{background:#1e4fa3;border-color:#1e4fa3}
body.view-j .seat-no,body.view-j .price tr.total td{color:#1e4fa3}
.start{background:#fff;border:2px solid #161b26;border-radius:14px;padding:14px 18px;margin:12px 0}
.start h2{margin:0 0 6px;font-size:1.15rem}
.start ul.have{margin:4px 0 8px;padding-left:1.2em}.start ul.have li{margin:3px 0}
.start .buy{margin:8px 0}
.stop{background:#fff;border:3px solid #c0262d;border-radius:10px;padding:10px 14px;margin:10px 0}
.stop-title{font-weight:900;color:#c0262d;margin-bottom:2px}
.stop ul{margin:4px 0 0;padding-left:1.2em}.stop li{margin:3px 0}
p.stop{margin:10px 0}
.optchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.optchip{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #1e4fa3;border-radius:999px;padding:8px 14px;min-height:44px;font:inherit;font-weight:700;color:#163a78;cursor:pointer}
.optchip .oc-n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#1e4fa3;color:#fff;align-items:center;justify-content:center;font-size:.85rem}
.optchip.on{background:#1e4fa3;color:#fff}.optchip.on .oc-n{background:#fff;color:#1e4fa3}
.opt-head{background:#eaf1fb;border-radius:10px;padding:10px 14px;margin:10px 0}
#opt-box:empty{display:none}
@media (max-width:899px){
  .who{grid-template-columns:1fr}
  .shots{flex-direction:column;gap:12px}
  .shots figure{width:100%}
  .banner-who{font-size:1.45rem}
  .panel-head{padding:12px 14px;flex-wrap:wrap}
  .optpick{grid-template-columns:1fr}
  .panel-letter{order:1}
  .panel-close{order:2}
  .panel-headtext{order:3;flex:1 1 100%}
  .panel-body .grid th,.panel-body .grid td{padding:6px 7px;font-size:.88rem}
  .panel-letter{width:40px;height:40px;font-size:1.3rem}
  .panel-body{padding:10px 8px 4px}
  .panel-foot{margin:6px 8px 10px}
  .top{position:static}
}

</style>
</head>
<body>

        p("do", [b("Go to alaskaair.com. "), "One way, ", b("SAN"), " to ", b("BOS"), ", ", b("Oct 24, 2026"), ", ", b("2 adults"), ". Find ", b("AS 389"), ", 8:15 am to 5:07 pm, nonstop (outlined)."])
      ], [figure("shots/a01-results.jpg", "AS 389, SAN to BOS, 8:15 am to 5:07 pm. Main is $281 per person.", [[2.4, 47.7, 94.2, 19.4]])]),

      ], [

    F1.add(card({ id: "j-2", title: "Seats on AS 389", time: "about 3 min", parts: [

      ], [figure(o.img, o.cap, [[3, 33, 94, 31]])])
    ] }));

    // ----- FLIGHT 2 panel: the flight home, with five OPTION panels inside -----
    var F2 = panel({ cls: "p-flight", label: "FLIGHT 2 OF 2 · STARTS HERE", title: "Boston → San Diego · Wed Oct 28 · five options, " + boss + " picks ONE", sub: "Do only the option letter " + boss + " names (3 steps). Skip the other four.",
      foot: { label: "FLIGHT 2 ENDS HERE · ALL DONE", title: "You should now have 2 confirmations: one to Boston and one home. Forward both e-tickets to " + EMAIL + ".", sub: "If you are not sure a payment went through, do not buy again: check the email and ask " + boss + "." } });
    out.push(F2.el);
    F2.body.appendChild(stopLine([b("Do not start an option until " + boss + " tells you its letter."), " Tap the option below, one at a time."]));
    var panels = [], btns = [];
    var pickNote = p("small", ["Tap an option to see its three steps. You see one at a time."]);
    function hideAll() { panels.forEach(function (x) { x.hidden = true; }); btns.forEach(function (x) { x.classList.remove("on"); x.setAttribute("aria-pressed", "false"); }); pickNote.hidden = false; }

        part(null, [h("ol", { class: "how" }, r.how.slice(0, 3).map(function (x) { return h("li", { text: x }); }))])
      ] }));

        ], [figure(r.img, r.cap, r.hl)])

        part(null, [
          p("do", [b("Same as Flight 1, step 3: "), "enter Jeff and Alex, decline refundable upgrades, insurance, bags and credit-card offers, and pay with the company card."]),
          stopLine([b("Stop and ask " + boss + " if the total for 2 is over " + r.refMax + "."), " Otherwise ", b("you"), " click the final purchase button."]),
          p("do", [b("Done: "), "forward the e-ticket email to " + EMAIL + " and message " + owner + " the confirmation number and amount."])
        ])
      ] }));
    });
    out.push(faq(FAQ_COMMON.concat(FAQ_JA)));
    curGroup = []; stepNo = 0;
    return out;
  }
  // shared by flight 1 and flight 2: the same short details / pay / save list
  function payBlock(maxTotal) {
    return [
      p("do", [b("Travelers: "), "Jeff and Alex, names exactly as on their IDs, date of birth, gender, phone, email, Known Traveler and mileage numbers if " + owner + " sent them."]),
      p("do", [b("Decline "), "refundable upgrades, insurance, bags (carry-on only), upgrades and credit-card offers."]),

      p("do", [b("Done: "), "forward the e-ticket email to " + EMAIL + " and message " + owner + " the confirmation number and amount. It is booked only when the confirmation page and e-ticket email appear."])
    ];

  function intro() {
    $("intro").appendChild(h("div", { class: "intro-in" }, [
      h("h1", { text: "Flight booking guides" }),
      p("big", ["Two separate bookings. ", b("Pick the one you are booking now:")]),

        h("button", { type: "button", class: "who-btn b", id: "pick-b", onclick: function () { show("brittany", true); } }, [h("span", { class: "who-top", text: "BOOKING 1" }), h("span", { class: "who-name", text: "Brittany" }), h("span", { class: "who-sub", text: "Los Angeles → Boston · Delta · 1 traveler" })]),
        h("button", { type: "button", class: "who-btn j", id: "pick-j", onclick: function () { show("jeff-alex", true); } }, [h("span", { class: "who-top", text: "BOOKING 2" }), h("span", { class: "who-name", text: "Jeff and Alex" }), h("span", { class: "who-sub", text: "San Diego → Boston · Alaska + return option · 2 travelers" })])

    ]));
  }
  var built = {};
  function show(which, push) {
    var secB = $("sec-b"), secJ = $("sec-j"), isB = which === "brittany", isJ = which === "jeff-alex";
    if (isB && !built.b) { brittany().forEach(function (n) { secB.appendChild(n); }); built.b = true; var f1 = secB.querySelector("details"); if (f1) f1.open = true; }
    if (isJ && !built.j) { jeffAlex().forEach(function (n) { secJ.appendChild(n); }); built.j = true; var f2 = secJ.querySelector("details"); if (f2) f2.open = true; }
    secB.hidden = !isB; secJ.hidden = !isJ;
    $("pick-b").classList.toggle("on", isB); $("pick-j").classList.toggle("on", isJ);
    $("pick-b").setAttribute("aria-pressed", String(isB)); $("pick-j").setAttribute("aria-pressed", String(isJ));
    var t = isB ? "Brittany" : isJ ? "Jeff and Alex" : "";
    $("app-title").textContent = t ? "ClioCon · Booking for " + t : "ClioCon · Flight booking guides";
    document.title = t ? "ClioCon flights: " + t : "ClioCon flight booking guides";
    document.body.className = isB ? "view-b" : isJ ? "view-j" : "";
    if (push) { try { history.replaceState(null, "", "#" + which); } catch (e) { location.hash = which; } window.scrollTo({ top: $("who-anchor").offsetTop - 8, behavior: "smooth" }); }
  }
  document.addEventListener("DOMContentLoaded", function () {
    dlg = $("lightbox"); dlgImg = $("lightbox-img"); dlgCap = $("lightbox-cap");
    $("lightbox-close").addEventListener("click", function () { dlg.close(); });
    dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
    intro();
    var hsh = (location.hash || "").replace("#", "");
    show(hsh === "brittany" || hsh === "jeff-alex" ? hsh : "", false);
    function setAll(open) { document.querySelectorAll("main details").forEach(function (d) { d.open = open; }); }
    $("expand-all").addEventListener("click", function () { setAll(true); });
    $("collapse-all").addEventListener("click", function () { setAll(false); });
    window.addEventListener("hashchange", function () { var x = location.hash.replace("#", ""); if (x === "brittany" || x === "jeff-alex") show(x, false); });
  });
})();
